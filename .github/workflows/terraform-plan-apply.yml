name: Terraform Plan (Review Before Apply)

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS deployment region
        required: true
        type: string
        default: us-east-1
      budget_alert_email:
        description: Email for the mandatory low-threshold budget alert
        required: true
        type: string
      alert_email:
        description: Optional email for CloudWatch/security alarms
        required: false
        type: string
        default: ""
      honeypot_ingress_cidrs:
        description: JSON IPv4 CIDR list, e.g. ["0.0.0.0/0"]; leave [] for no listener exposure
        required: true
        type: string
        default: "[]"
      enable_linux_honeypot:
        description: Enable Linux Cowrie EC2 (compute and public IPv4 may cost)
        required: true
        type: boolean
        default: false
      enable_web_honeypot:
        description: Enable web decoy EC2 (compute and public IPv4 may cost)
        required: true
        type: boolean
        default: false
      enable_windows_honeypot:
        description: Enable Windows EC2 (higher cost; disabled by default)
        required: true
        type: boolean
        default: false
      enable_smb_listener:
        description: Also expose SMB 445 on the Windows decoy
        required: true
        type: boolean
        default: false
      enable_guardduty:
        description: Enable GuardDuty; usage-based charges may apply
        required: true
        type: boolean
        default: false
      enable_security_hub:
        description: Enable Security Hub; usage-based charges may apply
        required: true
        type: boolean
        default: false
      enable_aws_config:
        description: Enable AWS Config; configuration-item charges may apply
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_VAR_aws_region: ${{ inputs.aws_region }}
  TF_VAR_budget_alert_email: ${{ inputs.budget_alert_email }}
  TF_VAR_alert_email: ${{ inputs.alert_email }}
  TF_VAR_honeypot_ingress_cidrs: ${{ inputs.honeypot_ingress_cidrs }}
  TF_VAR_enable_linux_honeypot: ${{ inputs.enable_linux_honeypot }}
  TF_VAR_enable_web_honeypot: ${{ inputs.enable_web_honeypot }}
  TF_VAR_enable_windows_honeypot: ${{ inputs.enable_windows_honeypot }}
  TF_VAR_enable_smb_listener: ${{ inputs.enable_smb_listener }}
  TF_VAR_enable_guardduty: ${{ inputs.enable_guardduty }}
  TF_VAR_enable_security_hub: ${{ inputs.enable_security_hub }}
  TF_VAR_enable_aws_config: ${{ inputs.enable_aws_config }}
  TF_VAR_enable_budget: "true"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  AWS_DEFAULT_REGION: ${{ inputs.aws_region }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          keys = ['sub', 'aud', 'repository', 'repository_owner', 'environment', 'job_workflow_ref']
          print(json.dumps({k: c.get(k) for k in keys}, indent=2))
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Initialize remote state
        run: >-
          terraform -chdir=terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=honeypot-soc/dev.tfstate"
          -backend-config="region=${TF_STATE_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Create reviewed plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Block destructive changes
        run: |
          terraform -chdir=terraform show -json tfplan > terraform/plan.json
          python terraform/scripts/guard-plan.py terraform/plan.json

      - name: Render review copy
        run: terraform -chdir=terraform show -no-color tfplan > terraform/plan.txt

      - name: Record plan provenance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "aws_region": os.environ["TF_VAR_aws_region"],
              "state_bucket": os.environ["TF_STATE_BUCKET"],
              "state_region": os.environ["TF_STATE_REGION"],
              "state_key": "honeypot-soc/dev.tfstate",
          }
          Path("terraform/plan-metadata.json").write_text(json.dumps(metadata), encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            terraform/tfplan
            terraform/plan.txt
            terraform/plan-metadata.json
          retention-days: 7
