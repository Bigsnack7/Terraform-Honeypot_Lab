name: Terraform Destroy Plan (Review Before Cleanup)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to create a destroy plan
        required: true
        type: string
      aws_region:
        description: Region containing the lab
        required: true
        type: string
        default: us-east-1
      budget_alert_email:
        description: Email used to satisfy the Terraform budget input
        required: true
        type: string

permissions:
  contents: read

env:
  TF_VAR_aws_region: ${{ inputs.aws_region }}
  TF_VAR_budget_alert_email: ${{ inputs.budget_alert_email }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  AWS_DEFAULT_REGION: ${{ inputs.aws_region }}

jobs:
  plan-destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DESTROY'
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: terraform-destroy-plan-${{ github.run_id }}

      - name: Initialize remote state
        run: >-
          terraform -chdir=terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=honeypot-soc/dev.tfstate"
          -backend-config="region=${TF_STATE_REGION}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Create destroy plan only
        run: terraform -chdir=terraform plan -destroy -input=false -out=tfplan

      - name: Render destroy plan for review
        run: terraform -chdir=terraform show -no-color tfplan > terraform/destroy-plan.txt

      - name: Record plan provenance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "aws_region": os.environ["TF_VAR_aws_region"],
              "state_bucket": os.environ["TF_STATE_BUCKET"],
              "state_region": os.environ["TF_STATE_REGION"],
              "state_key": "honeypot-soc/dev.tfstate",
          }
          Path("terraform/destroy-plan-metadata.json").write_text(json.dumps(metadata), encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.run_id }}
          path: |
            terraform/tfplan
            terraform/destroy-plan.txt
            terraform/destroy-plan-metadata.json
          retention-days: 7
